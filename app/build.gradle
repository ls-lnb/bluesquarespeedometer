plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36

    namespace "net.nhiroki.bluesquarespeedometer"
    defaultConfig {
        applicationId "net.nhiroki.bluesquarespeedometer"
        versionName "1.2.0"
        versionCode 14

        minSdk 23
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def signingProperties = new Properties()
            def signingPropertiesFile = rootProject.file("keystore/keystore.properties")
            if (signingPropertiesFile.exists()) {
                signingPropertiesFile.withInputStream { signingProperties.load(it) }
            }

            def storeFilePath = System.getenv("RELEASE_KEYSTORE_FILE") ?: signingProperties.getProperty("storeFile")
            if (storeFilePath != null) {
                storeFile rootProject.file(storeFilePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: signingProperties.getProperty("storePassword")
                keyAlias System.getenv("RELEASE_KEYSTORE_ALIAS") ?: signingProperties.getProperty("keyAlias")
                keyPassword System.getenv("RELEASE_KEYSTORE_KEY_PASSWORD") ?: signingProperties.getProperty("keyPassword")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed only when keystore/keystore.properties exists (gitignored);
            // without it the build falls back to an unsigned release APK.
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : null
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
